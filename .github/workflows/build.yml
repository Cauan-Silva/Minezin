name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate editable armor projects
        run: |
          python -m unittest discover -s tools -p "test_blockbench_projects.py"
          python tools/export_blockbench_projects.py --package build/blockbench-models.zip
      - uses: actions/upload-artifact@v4
        with:
          name: blockbench-models
          path: build/blockbench-models.zip
          if-no-files-found: error
      - name: Build mod
        run: ./gradlew build --no-daemon --console=plain
      - name: Summarize JUnit reports
        run: python tools/summarize_tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-test-reports
          path: build/test-results/test/*.xml
          if-no-files-found: ignore
      - name: Validate VFX GLSL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools libegl1 libgl1-mesa-dri
          glslangValidator -S vert src/main/resources/assets/arcanecontrol/shaders/core/atomic_energy.vsh
          glslangValidator -S frag src/main/resources/assets/arcanecontrol/shaders/core/atomic_energy.fsh
          glslangValidator -S vert src/main/resources/assets/arcanecontrol/shaders/core/gojo_energy.vsh
          glslangValidator -S frag src/main/resources/assets/arcanecontrol/shaders/core/gojo_energy.fsh
          glslangValidator -S vert src/main/resources/assets/arcanecontrol/shaders/core/anime_energy.vsh
          glslangValidator -S frag src/main/resources/assets/arcanecontrol/shaders/core/anime_energy.fsh
      - name: Render anime materials and armor in OpenGL
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          EGL_PLATFORM: surfaceless
        run: |
          python -m pip install moderngl==5.13.0 numpy==2.5.4 pillow==13.0.0
          python tools/preview_gojo_vfx.py --backend egl --output build/gojo-materials.png
          python tools/preview_power_vfx.py --backend egl --output build/anime-materials.png
          python tools/preview_cinematic_vfx.py --backend egl --output build/cinematic-vfx.png
          python tools/preview_armor_models.py --backend egl --output build/anime-armor.png
          python tools/preview_armor_models.py --poses --backend egl --output build/armor-poses.png
          python tools/preview_armor_models.py --boss-scale --backend egl --output build/boss-scale.png
          python tools/preview_armor_models.py --nemesis --backend egl --output build/anime-nemesis.png
          python tools/preview_armor_models.py --asta --backend egl --output build/anime-asta.png
      - uses: actions/upload-artifact@v4
        with:
          name: anime-visual-previews
          path: |
            build/gojo-materials.png
            build/anime-materials.png
            build/cinematic-vfx.png
            build/anime-armor.png
            build/armor-poses.png
            build/anime-nemesis.png
            build/boss-scale.png
            build/anime-asta.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: minezin-jar
          path: build/libs/*.jar
          if-no-files-found: error
