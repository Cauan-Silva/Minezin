plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = '1.5.0'
group = 'com.cauansilva.arcanecontrol'
base {
    archivesName = 'minezin'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                arcanecontrol {
                    source sourceSets.main
                }
            }
        }
        server {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                arcanecontrol {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven { url = 'https://maven.firstdarkdev.xyz/snapshots' }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url = 'https://maven.kosmx.dev/' }
}

// Integracoes opcionais declaradas no POM das bibliotecas nao fazem parte deste mod.
configurations.configureEach {
    exclude group: 'org.embeddedt'
    exclude group: 'maven.modrinth'
    exclude group: 'appeng'
    exclude group: 'dev.latvian.mods'
    exclude group: 'mezz.jei'
}

dependencies {
    implementation fg.deobf('com.lowdragmc.photon:photon-forge-1.20.1:1.1.17') { transitive = false }
    implementation fg.deobf('com.lowdragmc.ldlib:ldlib-forge-1.20.1:1.0.42') { transitive = false }
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.4.9')
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    implementation fg.deobf('dev.kosmx.player-anim:player-animation-lib-forge:1.0.2-rc1+1.20')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
}

tasks.named('test').configure {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar').configure {
    finalizedBy 'reobfJar'
}
